name: Release Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (for example v1.0.3)'
        required: true
        default: 'v1.0.3'
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare runner Android SDK
        id: sdk
        run: |
          test -n "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - id: unit
        run: sh scripts/test-timeline.sh
      - id: build
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintRelease --no-daemon --max-workers=4
      - id: apk
        run: python3 scripts/verify-release.py "$RELEASE_TAG"
      - name: Report failed stage
        if: failure()
        run: echo "::error title=Release verification stages::Java=${{ steps.java.outcome }} SDK=${{ steps.sdk.outcome }} unit=${{ steps.unit.outcome }} build=${{ steps.build.outcome }} APK=${{ steps.apk.outcome }}"
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - name: Create release with verified signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/$RELEASE_TAG/"*.apk \
            "release-assets/$RELEASE_TAG/calendar-widget_SHA256SUMS" \
            "release-assets/$RELEASE_TAG/calendar-widget_PUBLIC_CERTIFICATE_SHA256.txt" \
            "release-assets/$RELEASE_TAG/calendar-widget_release.json" \
            --verify-tag --title "calendar-widget $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
