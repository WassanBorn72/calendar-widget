plugins { id 'com.android.application' }

android {
    namespace 'com.example.daycalendar'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.wassanborn72.calendarwidget'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('CALENDAR_WIDGET_KEYSTORE')
            def passwordPath = System.getenv('CALENDAR_WIDGET_PASSWORD_FILE')
            if (keyPath && passwordPath) {
                storeFile file(keyPath)
                storeType 'JKS'
                storePassword new File(passwordPath).text.trim()
                keyAlias 'calendar-widget'
                keyPassword new File(passwordPath).text.trim()
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Never produce a distributable release without the long-lived signing key.
tasks.register('verifyReleaseSigning') {
    doLast {
        if (!System.getenv('CALENDAR_WIDGET_KEYSTORE') || !System.getenv('CALENDAR_WIDGET_PASSWORD_FILE')) {
            throw new GradleException('Set CALENDAR_WIDGET_KEYSTORE and CALENDAR_WIDGET_PASSWORD_FILE to private local files before building a release.')
        }
    }
}
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    dependsOn 'verifyReleaseSigning'
}
